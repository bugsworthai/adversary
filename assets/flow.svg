<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-label="How a review runs: install, point it at a PR, it checks each change, you read the preview, you pick what posts.">
<rect width="960" height="150" rx="16" fill="#0b0e13" stroke="#232831"/>
<line x1="80" y1="46" x2="880" y2="46" stroke="#232831" stroke-width="2"/>
<circle cx="80" cy="46" r="20" fill="#d60f2c"/><text x="80" y="52" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">1</text>
<text x="80" y="95" text-anchor="middle" fill="#eef2f7" font-size="15.5" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Install</text>
<text x="80" y="119" text-anchor="middle" fill="#929bab" font-size="13" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Add the skill to Claude</text>
<circle cx="280" cy="46" r="20" fill="#d60f2c"/><text x="280" y="52" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">2</text>
<text x="280" y="95" text-anchor="middle" fill="#eef2f7" font-size="15.5" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Point it at a PR</text>
<text x="280" y="119" text-anchor="middle" fill="#929bab" font-size="13" font-family="JetBrains Mono,Menlo,Consolas,monospace">/adversary 38842</text>
<circle cx="480" cy="46" r="20" fill="#d60f2c"/><text x="480" y="52" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">3</text>
<text x="480" y="95" text-anchor="middle" fill="#eef2f7" font-size="15.5" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">It checks each change</text>
<text x="480" y="119" text-anchor="middle" fill="#929bab" font-size="13" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Edge cases, callers, gaps</text>
<circle cx="680" cy="46" r="20" fill="#d60f2c"/><text x="680" y="52" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">4</text>
<text x="680" y="95" text-anchor="middle" fill="#eef2f7" font-size="15.5" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">You read the preview</text>
<text x="680" y="119" text-anchor="middle" fill="#929bab" font-size="13" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Every comment, next to its code</text>
<circle cx="880" cy="46" r="20" fill="#d60f2c"/><text x="880" y="52" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">5</text>
<text x="880" y="95" text-anchor="middle" fill="#eef2f7" font-size="15.5" font-weight="700" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">You pick what posts</text>
<text x="880" y="119" text-anchor="middle" fill="#929bab" font-size="13" font-family="JetBrains Mono,Menlo,Consolas,monospace">1 3-5, or all</text>
</svg>